# Categories for GitHub-generated release notes. These drive both the GitHub
# Release body and CHANGELOG.md (see scripts/update-changelog.mjs). A pull
# request appears in the first category it matches, so order matters.
changelog:
  categories:
    - title: Features and behavior changes
      labels:
        - enhancement
        - semver:minor
        - semver:major
    - title: Fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: Maintenance and dependencies
      labels:
        - dependencies
        - github_actions
        - semver:patch
    - title: Other changes
      labels:
        - "*"
