name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install VS Code Electron system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxss1 \
            libsecret-1-0 \
            libxkbfile1 \
            libgbm1 \
            libasound2t64 \
            libgtk-3-0 \
            libnss3 \
            xvfb

      - name: Run tests (compile + lint + integration)
        run: xvfb-run -a npm test

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Compile extension
        run: npm run compile

      - name: Verify VSIX packaging
        run: npx vsce package --no-git-tag-version
