version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
    ignore:
      # @types/node major versions track Node.js major releases. Our CI
      # workflows pin Node 22 (see .github/workflows/ci.yml), so jumping
      # @types/node ahead to a newer major (e.g. 26.x, matching Node 26)
      # just introduces type/runtime mismatches. Bump this deliberately,
      # together with the CI Node version, instead of via Dependabot.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
