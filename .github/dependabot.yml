version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
    ignore:
      # @types/node major versions track Node.js major releases. Our CI
      # workflows pin Node 22 (see .github/workflows/ci.yml), so jumping
      # @types/node ahead to a newer major (e.g. 26.x, matching Node 26)
      # just introduces type/runtime mismatches. Bump this deliberately,
      # together with the CI Node version, instead of via Dependabot.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # @types/vscode must not exceed engines.vscode: vsce rejects packages
      # whose VS Code types require a newer editor than the extension supports.
      # Raise both deliberately when increasing the minimum VS Code version.
      - dependency-name: "@types/vscode"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      # @vscode/test-cli@0.0.15 still depends on Mocha 11, so Mocha 12
      # installs a duplicate tree while the test runner continues using 11.
      # Keep accepting Mocha 11 updates until the test CLI supports Mocha 12.
      - dependency-name: mocha
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
